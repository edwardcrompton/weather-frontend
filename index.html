<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="temperature">
        <h1>Temperature</h1>
        <p id="temperature" class="temperature-value">--.-°C</p>
        <p id="timestamp" class="timestamp">Last updated: --:--:--</p>
        <p id="maxTemperature" class="temperature-extreme">Max: --.-°C at --:--</p>
        <p id="minTemperature" class="temperature-extreme">Min: --.-°C at --:--</p>
        <canvas id="temperatureChart" width="400" height="400"></canvas>
        <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
        <div class="time-range">
            <label><input autocomplete="off" type="radio" name="timeRange" value="24" checked> 24 hours</label>
            <label><input autocomplete="off" type="radio" name="timeRange" value="48"> 48 hours</label>
            <label><input autocomplete="off" type="radio" name="timeRange" value="168"> 1 week</label>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
